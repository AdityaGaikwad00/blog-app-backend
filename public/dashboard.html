<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="InkWell is a full-stack blog platform built with Node.js, Express and MongoDB. Write, edit and share your posts.">
  <meta name="theme-color" content="#1f5f5b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="InkWell Blog - Write what you know. Share what you learn.">
  <meta property="og:description" content="A full-stack blog application with secure login, profiles, search and a personal dashboard.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f5f5b'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EI%3C/text%3E%3C/svg%3E">
  <title>Dashboard | InkWell Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <header class="site-header">
    <a href="index.html" class="logo">InkWell</a>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-blog.html">Write</a>
      <a href="profile.html" id="profileLink" style="display:none">Profile</a>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch light or dark theme">&#9788;</button>
      <a href="login.html" id="loginLink">Login</a>
      <a href="register.html" class="btn btn-small" id="registerLink">Register</a>
    </nav>
  </header>
  <main>
    <section class="container">
      <div class="dash-head">
        <div>
          <h1 id="greeting">Your dashboard</h1>
          <p class="muted" id="welcome"></p>
        </div>
        <a href="create-blog.html" class="btn">New blog</a>
      </div>
      <div class="stats">
        <div class="stat"><strong id="statPosts">0</strong><span>Posts</span></div>
        <div class="stat"><strong id="statWords">0</strong><span>Words written</span></div>
        <div class="stat"><strong id="statCats">0</strong><span>Categories</span></div>
      </div>
      <h2>Your posts</h2>
      <div class="grid" id="myBlogs"></div>
    </section>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 InkWell Blog. All rights reserved.</p>
    <p class="credit">Created by <strong>Aditya Gaikwad</strong></p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>

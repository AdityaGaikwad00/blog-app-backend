<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Blog | InkWell Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="edit">
  <header class="site-header">
    <a href="index.html" class="logo">InkWell</a>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-blog.html">Write</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="register.html" class="btn btn-small" id="registerLink">Register</a>
    </nav>
  </header>
  <main>
    <section class="auth-box wide">
      <h1>Edit your blog</h1>
      <form id="blogForm" novalidate>
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Give your post a title">
        <label for="category">Category</label>
        <select id="category">
          <option>Technology</option>
          <option>Career</option>
          <option>Lifestyle</option>
          <option>Travel</option>
        </select>
        <label for="content">Content</label>
        <textarea id="content" rows="10" placeholder="Start writing..."></textarea>
        <p class="error" id="formError"></p>
        <button type="submit" class="btn">Update blog</button>
        <a class="btn btn-outline" href="dashboard.html">Cancel</a>
      </form>
    </section>
  </main>
  <footer class="site-footer">&copy; 2026 InkWell Blog.</footer>
  <script src="js/script.js"></script>
</body>
</html>
